<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <filter id="gloss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#07172B" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3258"/>
      <stop offset="100%" stop-color="#081E36"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE6332"/>
      <stop offset="100%" stop-color="#B8491D"/>
    </linearGradient>
  </defs>

  <!-- Left 'H' and Left Roof Peak (Navy) -->
  <g id="left-navy" fill="url(#navyGrad)">
    <!-- Roof Overhang Left & Left Gable -->
    <path d="M 205 165 L 400 60 L 400 102 L 245 186 L 245 225 L 205 225 Z" />
    
    <!-- 'H' Left Pillar -->
    <rect x="245" y="235" width="46" height="135" />
    
    <!-- 'H' Crossbar -->
    <rect x="291" y="275" width="58" height="42" />
    
    <!-- 'H' Right Pillar (Left half of center divider) -->
    <rect x="349" y="132" width="51" height="238" />
  </g>

  <!-- Right 'F' and Right Roof Peak with Chimney (Terracotta Orange) -->
  <g id="right-orange" fill="url(#orangeGrad)">
    <!-- Chimney -->
    <rect x="508" y="94" width="44" height="60" />
    
    <!-- Roof Overhang Right & Right Gable -->
    <path d="M 400 60 L 595 165 L 595 225 L 555 225 L 555 186 L 400 102 Z" />
    
    <!-- 'F' Main Stem (Right half of center divider) -->
    <rect x="408" y="132" width="54" height="238" />
    
    <!-- 'F' Top Bar -->
    <rect x="462" y="172" width="80" height="42" />
    
    <!-- 'F' Middle Bar -->
    <rect x="462" y="260" width="78" height="40" />
  </g>

  <!-- Typography: HomeFirst -->
  <text x="400" y="420" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-weight="900" 
        font-size="82" 
        fill="#0B2546" 
        letter-spacing="-1.5">HomeFirst</text>

  <!-- Typography: R O O F I N G -->
  <text x="404" y="468" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-weight="800" 
        font-size="28" 
        fill="#C7532B" 
        letter-spacing="18">ROOFING</text>
</svg>
